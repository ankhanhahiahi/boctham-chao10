<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ECOP - Bốc Thăm May Mắn</title>
  
  <!-- IMPORT FONT CHỮ MERRIWEATHER -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">

  <style>
    /* BẢNG MÀU CHÍNH TỪ LOGO ECOP */
    :root {
      --ecop-yellow: #E3B652;
      --ecop-orange: #E08A54;
      --ecop-blue: #59B5D8;
      --ecop-red: #D75756;
      --ecop-dark: #0e3a6c;
      --ecop-green: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Merriweather', serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f1f5f9;
      background-image: 
        radial-gradient(rgba(89, 181, 216, 0.12) 1.5px, transparent 1.5px),
        radial-gradient(rgba(224, 138, 84, 0.12) 1.5px, #f1f5f9 1.5px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* HIỆU ỨNG CÁC ICON MÈO VÀ PHIM RƠI TỪ TRÊN XUỐNG */
    .falling-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .falling-item {
      position: absolute;
      top: -60px;
      user-select: none;
      animation: fallAndSway linear infinite;
      opacity: 0.85;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.06));
    }

    @keyframes fallAndSway {
      0% {
        transform: translateY(-60px) rotate(0deg) translateX(0);
        opacity: 0.9;
      }
      50% {
        transform: translateY(50vh) rotate(180deg) translateX(25px);
      }
      100% {
        transform: translateY(105vh) rotate(360deg) translateX(-20px);
        opacity: 0.2;
      }
    }

    /* THẺ GIAO DIỆN CHÍNH (CARD) */
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 32px 24px;
      border-radius: 28px;
      box-shadow: 
        0 20px 40px rgba(14, 58, 108, 0.08),
        0 2px 8px rgba(0, 0, 0, 0.04);
      text-align: center;
      position: relative;
      z-index: 10;
      border: 3px solid #ffffff;
    }

    /* KHUNG LOGO ECOP */
    .logo-container {
      display: inline-block;
      margin-bottom: 12px;
    }

    .logo-img {
      max-width: 180px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    /* TIÊU ĐỀ TRÊN CÙNG */
    .main-title {
      margin-bottom: 24px;
      line-height: 1.35;
    }

    .title-line1 {
      display: block;
      font-size: 21px;
      font-weight: 700;
      color: var(--ecop-dark);
      letter-spacing: 0.5px;
    }

    .title-line2 {
      display: block;
      font-size: 28px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--ecop-yellow) 0%, var(--ecop-orange) 35%, var(--ecop-blue) 70%, var(--ecop-red) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-top: 4px;
    }

    /* FORM NHẬP THÔNG TIN */
    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
      margin-left: 2px;
    }

    .form-group input {
      width: 100%;
      padding: 13px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 14px;
      font-size: 15px;
      outline: none;
      background: #ffffff;
      color: #0f172a;
      transition: all 0.25s ease;
    }

    .form-group input:focus {
      border-color: var(--ecop-blue);
      box-shadow: 0 0 0 4px rgba(89, 181, 216, 0.2);
    }

    .form-group input::placeholder {
      color: #94a3b8;
      font-size: 13px;
      font-style: italic;
    }

    /* NÚT GỬI KẾT QUẢ */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, var(--ecop-green) 0%, #16a34a 100%);
      color: #ffffff;
      border: none;
      padding: 16px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 8px 20px rgba(34, 197, 94, 0.3);
      transition: all 0.2s ease;
      letter-spacing: 0.5px;
    }

    .btn-submit:active {
      transform: scale(0.98);
      box-shadow: 0 4px 10px rgba(34, 197, 94, 0.2);
    }

    /* MÀN HÌNH THÀNH CÔNG */
    #successScreen {
      display: none;
      text-align: center;
      padding: 10px 0;
    }

    .success-badge {
      width: 72px;
      height: 72px;
      background: #dcfce7;
      color: #166534;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin: 0 auto 16px auto;
      box-shadow: 0 10px 20px rgba(34, 197, 94, 0.2);
    }

    .success-box {
      background: #f0fdf4;
      border: 2px dashed var(--ecop-green);
      padding: 16px;
      border-radius: 16px;
      margin-top: 16px;
    }
  </style>
</head>
<body>

  <!-- KHU VỰC TẠO HIỆU ỨNG RƠI -->
  <div class="falling-container" id="fallingContainer"></div>

  <!-- THẺ CHÍNH (CARD) -->
  <div class="card">
    
    <!-- LOGO ECOP -->
    <div class="logo-container">
      <img src="https://i.ibb.co/ymHxvWhF/LOGO-ECOP.png" alt="LOGO ECOP" class="logo-img">
    </div>

    <!-- TIÊU ĐỀ CHÍNH -->
    <h1 class="main-title">
      <span class="title-line1">🎬 BỐC THĂM 🐾</span>
      <span class="title-line2">MAY MẮN</span>
    </h1>

    <!-- FORM ĐIỀN THÔNG TIN -->
    <div id="formScreen">
      <form id="ecopForm">
        <div class="form-group">
          <label for="name">Họ và Tên *</label>
          <input type="text" id="name" required placeholder="Nhập họ và tên...">
        </div>

        <div class="form-group">
          <label for="phone">Số điện thoại *</label>
          <input type="tel" id="phone" required placeholder="Nhập số điện thoại...">
        </div>

        <div class="form-group">
          <label for="className">Lớp *</label>
          <input type="text" id="className" required placeholder="VD: 10A1...">
        </div>

        <div class="form-group">
          <label for="email">Email nhận xác nhận *</label>
          <input type="email" id="email" required placeholder="Nhập địa chỉ email...">
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">GỬI KẾT QUẢ 🚀</button>
      </form>
    </div>

    <!-- MÀN HÌNH THÀNH CÔNG -->
    <div id="successScreen">
      <div class="success-badge">✓</div>
      <h2 style="color: #166534; font-size: 20px; font-weight: 700; margin-bottom: 8px;">GỬI KẾT QUẢ THÀNH CÔNG!</h2>
      <p style="color: #64748b; font-size: 14px; line-height: 1.6;">
        Thông tin của bạn đã được hệ thống ghi nhận.
      </p>
      
      <div class="success-box">
        <p style="color: #0e3a6c; font-size: 14px; font-weight: 700; margin: 0; line-height: 1.5;">
          📩 Hãy kiểm tra Email ngay để xem phần quà may mắn bạn nhận được nhé!
        </p>
      </div>

      <p style="color: #94a3b8; font-size: 13px; margin-top: 20px;">Cảm ơn bạn đã tham gia booth của ECOP! 🎉🐾</p>
    </div>

  </div>

  <script>
    // 1. TẠO CÁC ICON MÈO VÀ PHIM RƠI LIÊN TỤC
    const fallingItems = [
      '🐱', '🐈‍⬛', '😻', '😸', '😽', '🙀', '🐱‍👓', '🐾', 
      '🎬', '🎞️', '🎥', '🍿', '🎟️', '⭐', '🎈'
    ];
    const container = document.getElementById('fallingContainer');

    function createFallingItem() {
      const item = document.createElement('div');
      item.className = 'falling-item';
      item.innerText = fallingItems[Math.floor(Math.random() * fallingItems.length)];

      const startLeft = Math.random() * 100;
      const size = Math.random() * 16 + 22;
      const duration = Math.random() * 5 + 6;
      const delay = Math.random() * 2;

      item.style.left = startLeft + 'vw';
      item.style.fontSize = size + 'px';
      item.style.animationDuration = duration + 's';
      item.style.animationDelay = delay + 's';

      container.appendChild(item);

      setTimeout(() => {
        item.remove();
      }, (duration + delay) * 1000);
    }

    for (let i = 0; i < 22; i++) {
      createFallingItem();
    }
    setInterval(createFallingItem, 550);

    // 2. KẾT NỐI VÀ GỬI DỮ LIỆU ĐẾN GOOGLE APPS SCRIPT MỚI
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzZgiy9o0E1RvZm-35B98GfEy1i40cjl2W526cJ8jY5TkL65oF4eOaFdyQs7qyDPa_-UA/exec";

    document.getElementById("ecopForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.innerText = "⏳ Đang quay quà...";
      submitBtn.disabled = true;

      const payload = {
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        className: document.getElementById("className").value,
        email: document.getElementById("email").value
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        document.getElementById("formScreen").style.display = "none";
        document.getElementById("successScreen").style.display = "block";
      })
      .catch((error) => {
        alert("Có lỗi xảy ra khi gửi dữ liệu. Vui lòng thử lại!");
        submitBtn.innerText = "GỬI KẾT QUẢ 🚀";
        submitBtn.disabled = false;
      });
    });
  </script>
</body>
</html>
