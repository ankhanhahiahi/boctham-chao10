<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Booth Trò Chơi ECOP - Gửi Kết Quả</title>
  <style>
    :root {
      --ecop-blue: #1e3a8a;
      --ecop-green: #166534;
      --ecop-red: #dc2626;
      --bg-color: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
    }

    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { color: var(--ecop-blue); font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .header p { color: #64748b; font-size: 14px; }

    .form-group { margin-bottom: 16px; text-align: left; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: all 0.2s;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--ecop-blue); box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.15); }

    .btn-submit {
      width: 100%;
      background: var(--ecop-blue);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #1e1b4b; }

    /* MÀN HÌNH THÀNH CÔNG */
    #successScreen {
      display: none;
      text-align: center;
      padding: 20px 10px;
    }
    .success-icon {
      width: 64px;
      height: 64px;
      background: #dcfce7;
      color: #166534;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 16px auto;
    }
    .success-title { color: var(--ecop-blue); font-size: 20px; font-weight: 800; margin-bottom: 8px; }
    .success-desc { color: #475569; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
    .prize-badge {
      display: inline-block;
      background: #fef2f2;
      color: var(--ecop-red);
      border: 1px dashed var(--ecop-red);
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: 800;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Form điền thông tin -->
    <div id="formScreen">
      <div class="header">
        <h1>EVENT CLUB OF PHC</h1>
        <p>GỬI KẾT QUẢ BỐC THĂM NHẬN QUÀ</p>
      </div>

      <form id="ecopForm">
        <div class="form-group">
          <label for="name">Họ và Tên *</label>
          <input type="text" id="name" required placeholder="Nhập họ và tên...">
        </div>

        <div class="form-group">
          <label for="phone">Số điện thoại *</label>
          <input type="tel" id="phone" required placeholder="Nhập số điện thoại...">
        </div>

        <div class="form-group">
          <label for="className">Lớp *</label>
          <input type="text" id="className" required placeholder="Nhập lớp (VD: 10A1)...">
        </div>

        <div class="form-group">
          <label for="email">Email nhận xác nhận *</label>
          <input type="email" id="email" required placeholder="Nhập địa chỉ email...">
        </div>

        <div class="form-group">
          <label for="prize">Phần quà trúng thưởng *</label>
          <select id="prize" required>
            <option value="MÓC KHÓA">MÓC KHÓA</option>
            <option value="TRANH VẼ ẢNH">TRANH VẼ ẢNH</option>
            <option value="BLIND BOX">BLIND BOX</option>
          </select>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">GỬI KẾT QUẢ</button>
      </form>
    </div>

    <!-- Màn hình gửi kết quả thành công -->
    <div id="successScreen">
      <div class="success-icon">✓</div>
      <h2 class="success-title">GỬI KẾT QUẢ THÀNH CÔNG!</h2>
      <p class="success-desc">Thông tin của bạn đã được lưu vào hệ thống. Email thông báo phần quà cũng đã được gửi đến hộp thư của bạn.</p>
      <p style="font-size: 13px; color: #64748b;">Phần quà bạn đã nhận:</p>
      <div class="prize-badge" id="displayPrize">MÓC KHÓA</div>
    </div>
  </div>

  <script>
    // Link Web App chính thức của bạn
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXfv-DWdjr_erjoHpT3-Q5l2BTlBJGP1jTzSw9DvA0tyinGFxTIywVViAr3PsB-bBJxg/exec";

    document.getElementById("ecopForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.innerText = "Đang gửi...";
      submitBtn.disabled = true;

      const payload = {
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        className: document.getElementById("className").value,
        email: document.getElementById("email").value,
        prize: document.getElementById("prize").value
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        // Chuyển sang màn hình gửi kết quả thành công
        document.getElementById("displayPrize").innerText = payload.prize.toUpperCase();
        document.getElementById("formScreen").style.display = "none";
        document.getElementById("successScreen").style.display = "block";
      })
      .catch((error) => {
        alert("Có lỗi xảy ra khi gửi dữ liệu. Vui lòng thử lại!");
        submitBtn.innerText = "GỬI KẾT QUẢ";
        submitBtn.disabled = false;
      });
    });
  </script>
</body>
</html>
