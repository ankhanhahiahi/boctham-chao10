<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ECOP - Bốc Thăm May Mắn</title>
  <style>
    :root {
      --ecop-green: #22c55e;
      --ecop-blue: #1e3a8a;
      --bg-color: #f8fafc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    body {
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* BIỂU TƯỢNG TRANG TRÍ NỀN TRANH / PHONG CÁCH ECOP */
    .bg-icon {
      position: absolute;
      font-size: 24px;
      opacity: 0.25;
      user-select: none;
      pointer-events: none;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 36px 28px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.06);
      text-align: center;
      position: relative;
      z-index: 10;
      border: 1px solid #f1f5f9;
    }

    /* LOGO ECOP ĐA MÀU */
    .logo { font-size: 36px; font-weight: 900; letter-spacing: 2px; margin-bottom: 8px; }
    .logo span:nth-child(1) { color: #eab308; }
    .logo span:nth-child(2) { color: #f97316; }
    .logo span:nth-child(3) { color: #06b6d4; }
    .logo span:nth-child(4) { color: #ec4899; }

    .title { color: #1e293b; font-size: 22px; font-weight: 800; margin-bottom: 24px; display: flex; align-items: center; justify-content: center; gap: 8px; }

    .form-group { text-align: left; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: #475569; margin-bottom: 6px; }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background: #f8fafc;
      transition: all 0.2s;
    }
    .form-group input:focus { border-color: var(--ecop-green); background: #fff; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15); }

    .btn-submit {
      width: 100%;
      background: var(--ecop-green);
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 14px rgba(34, 197, 94, 0.35);
      transition: all 0.2s;
    }
    .btn-submit:hover { background: #16a34a; transform: translateY(-1px); }

    /* MÀN HÌNH THÀNH CÔNG */
    #successScreen { display: none; text-align: center; padding: 10px 0; }
    .success-icon {
      width: 64px;
      height: 64px;
      background: #dcfce7;
      color: #166534;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 16px auto;
    }
  </style>
</head>
<body>

  <!-- ICONS NỀN TRANG TRÍ -->
  <div class="bg-icon" style="top: 10%; left: 8%;">🎬</div>
  <div class="bg-icon" style="top: 15%; right: 12%;">🐾</div>
  <div class="bg-icon" style="top: 65%; left: 10%;">🎁</div>
  <div class="bg-icon" style="top: 75%; right: 8%;">🎥</div>
  <div class="bg-icon" style="top: 40%; left: 5%;">🍿</div>
  <div class="bg-icon" style="top: 45%; right: 6%;">⭐</div>

  <div class="card">
    <div class="logo">
      <span>E</span><span>C</span><span>O</span><span>P</span>
    </div>
    <h1 class="title">🎬 BỐC THĂM 🐾 MAY MẮN</h1>

    <!-- FORM ĐIỀN THÔNG TIN (KHÔNG CÓ Ô CHỌN QUÀ) -->
    <div id="formScreen">
      <form id="ecopForm">
        <div class="form-group">
          <label for="name">Họ và Tên *</label>
          <input type="text" id="name" required placeholder="Nhập họ và tên...">
        </div>

        <div class="form-group">
          <label for="phone">Số điện thoại *</label>
          <input type="tel" id="phone" required placeholder="Nhập số điện thoại...">
        </div>

        <div class="form-group">
          <label for="className">Lớp *</label>
          <input type="text" id="className" required placeholder="VD: 10A1...">
        </div>

        <div class="form-group">
          <label for="email">Email nhận xác nhận *</label>
          <input type="email" id="email" required placeholder="Nhập địa chỉ email...">
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">GỬI KẾT QUẢ</button>
      </form>
    </div>

    <!-- MÀN HÌNH THÀNH CÔNG -->
    <div id="successScreen">
      <div class="success-icon">✓</div>
      <h2 style="color: #166534; font-size: 20px; font-weight: 800; margin-bottom: 8px;">GỬI KẾT QUẢ THÀNH CÔNG!</h2>
      <p style="color: #64748b; font-size: 14px; line-height: 1.5; margin-bottom: 16px;">
        Thông tin của bạn đã được lưu vào hệ thống.
      </p>
      <div style="background: #f0fdf4; border: 1px dashed #22c55e; padding: 14px; border-radius: 12px;">
        <p style="color: #0e3a6c; font-size: 14px; font-weight: bold; margin: 0;">📩 Hãy kiểm tra Email ngay để xem phần quà may mắn bạn nhận được nhé!</p>
      </div>
      <p style="color: #94a3b8; font-size: 13px; margin-top: 16px;">Cảm ơn bạn đã tham gia booth của ECOP! 🎉</p>
    </div>
  </div>

  <script>
    // Link Web App mới nhất của bạn
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzZgiy9o0E1RvZm-35B98GfEy1i40cjl2W526cJ8jY5TkL65oF4eOaFdyQs7qyDPa_-UA/exec";

    document.getElementById("ecopForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const submitBtn = document.getElementById("submitBtn");
      submitBtn.innerText = "⏳ Đang xử lý...";
      submitBtn.disabled = true;

      const payload = {
        name: document.getElementById("name").value,
        phone: document.getElementById("phone").value,
        className: document.getElementById("className").value,
        email: document.getElementById("email").value
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        document.getElementById("formScreen").style.display = "none";
        document.getElementById("successScreen").style.display = "block";
      })
      .catch((error) => {
        alert("Có lỗi xảy ra khi gửi dữ liệu. Vui lòng thử lại!");
        submitBtn.innerText = "GỬI KẾT QUẢ";
        submitBtn.disabled = false;
      });
    });
  </script>
</body>
</html>
