<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ECOP - Bốc Thăm May Mắn</title>
  <style>
    :root {
      --ecop-yellow: #E3B652;
      --ecop-orange: #E08A54;
      --ecop-blue: #59B5D8;
      --ecop-red: #D75756;
      --ecop-dark: #0e3a6c;
      --ecop-green: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #f1f5f9;
      background-image: 
        radial-gradient(rgba(89, 181, 216, 0.12) 1.5px, transparent 1.5px),
        radial-gradient(rgba(224, 138, 84, 0.12) 1.5px, #f1f5f9 1.5px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* HIỆU ỨNG ICON RƠI */
    .falling-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .falling-item {
      position: absolute;
      top: -60px;
      user-select: none;
      animation: fallAndSway linear infinite;
      opacity: 0.85;
    }

    @keyframes fallAndSway {
      0% { transform: translateY(-60px) rotate(0deg) translateX(0); opacity: 0.9; }
      50% { transform: translateY(50vh) rotate(180deg) translateX(25px); }
      100% { transform: translateY(105vh) rotate(360deg) translateX(-20px); opacity: 0.2; }
    }

    /* KHUNG THẺ CHÍNH */
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      padding: 32px 24px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(14, 58, 108, 0.08);
      text-align: center;
      position: relative;
      z-index: 10;
      border: 3px solid #ffffff;
    }

    /* KHU VỰC LOGO TỰ ĐỘNG CẮT NỀN ĐEN */
    .logo-wrapper {
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .logo-box {
      cursor: pointer;
      position: relative;
      display: inline-block;
      padding: 8px;
      border-radius: 16px;
      transition: background 0.2s;
    }

    .logo-box:hover {
      background: rgba(89, 181, 216, 0.08);
    }

    #logoCanvas {
      max-width: 220px;
      height: auto;
      display: block;
    }

    .upload-tip {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
      font-weight: 600;
    }

    /* TIÊU ĐỀ */
    .main-title { margin-bottom: 24px; line-height: 1.25; }
    .title-line1 { display: block; font-size: 22px; font-weight: 800; color: var(--ecop-dark); }
    .title-line2 {
      display: block; font-size: 30px; font-weight: 900;
      background: linear-gradient(135deg, var(--ecop-yellow) 0%, var(--ecop-orange) 35%, var(--ecop-blue) 70%, var(--ecop-red) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-transform: uppercase; margin-top: 4px;
    }

    /* FORM NHẬP */
    .form-group { text-align: left; margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 14px 16px; border: 2px solid #e2e8f0;
      border-radius: 14px; font-size: 16px; outline: none; transition: all 0.25s ease;
    }
    .form-group input:focus { border-color: var(--ecop-blue); box-shadow: 0 0 0 4px rgba(89, 181, 216, 0.2); }

    /* NÚT SUBMIT */
    .btn-submit {
      width: 100%; background: linear-gradient(135deg, var(--ecop-green) 0%, #16a34a 100%);
      color: #ffffff; border: none; padding: 16px; border-radius: 16px;
      font-size: 17px; font-weight: 800; cursor: pointer; margin-top: 10px;
      box-shadow: 0 8px 20px rgba(34, 197, 94, 0.3);
    }

    #successScreen { display: none; text-align: center; padding: 10px 0; }
    .success-badge {
      width: 72px; height: 72px; background: #dcfce7; color: #166534;
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 36px; margin: 0 auto 16px auto;
    }
    .success-box { background: #f0fdf4; border: 2px dashed var(--ecop-green); padding: 16px; border-radius: 16px; margin-top: 16px; }
  </style>
</head>
<body>

  <div class="falling-container" id="fallingContainer"></div>

  <div class="card">
    
    <!-- KHU VỰC LOGO: BẠN CÓ THỂ CLICK VÀO ĐỂ CHỌN FILE LOGO ECOP_2.jpg TỪ MÁY -->
    <div class="logo-wrapper">
      <input type="file" id="logoFileInput" accept="image/*" style="display: none;">
      <div class="logo-box" onclick="document.getElementById('logoFileInput').click()">
        <canvas id="logoCanvas"></canvas>
        <p class="upload-tip">📁 Click để tải file LOGO ECOP_2.jpg từ máy lên</p>
      </div>
    </div>

    <h1 class="main-title">
      <span class="title-line1">🎬 BỐC THĂM 🐾</span>
      <span class="title-line2">MAY MẮN</span>
    </h1>

    <div id="formScreen">
      <form id="ecopForm">
        <div class="form-group">
          <label for="name">Họ và Tên *</label>
          <input type="text" id="name" required placeholder="Nhập họ và tên...">
        </div>
        <div class="form-group">
          <label for="phone">Số điện thoại *</label>
          <input type="tel" id="phone" required placeholder="Nhập số điện thoại...">
        </div>
        <div class="form-group">
          <label for="className">Lớp *</label>
          <input type="text" id="className" required placeholder="VD: 10A1...">
        </div>
        <div class="form-group">
          <label for="email">Email nhận xác nhận *</label>
          <input type="email" id="email" required placeholder="Nhập địa chỉ email...">
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">GỬI KẾT QUẢ 🚀</button>
      </form>
    </div>

    <div id="successScreen">
      <div class="success-badge">✓</div>
      <h2 style="color: #166534; font-size: 22px; font-weight: 800; margin-bottom: 8px;">GỬI KẾT QUẢ THÀNH CÔNG!</h2>
      <p style="color: #64748b; font-size: 14px;">Thông tin của bạn đã được hệ thống ghi nhận.</p>
      <div class="success-box">
        <p style="color: #0e3a6c; font-size: 15px; font-weight: 800; margin: 0;">
          📩 Hãy kiểm tra Email ngay để xem phần quà may mắn bạn nhận được nhé!
        </p>
      </div>
    </div>

  </div>

  <script>
    // 1. THUẬT TOÁN XỬ LÝ KHỬ NỀN ĐEN TRỰC TIẾP TỪ FILE LOCAL
    const logoInput = document.getElementById('logoFileInput');
    const canvas = document.getElementById('logoCanvas');
    const ctx = canvas.getContext('2d');

    function processAndDrawImage(imgSource) {
      const img = new Image();
      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const data = imgData.data;

        // Quét từng điểm ảnh và làm trong suốt nền đen
        for (let i = 0; i < data.length; i += 4) {
          const r = data[i];
          const g = data[i + 1];
          const b = data[i + 2];
          const brightness = (r + g + b) / 3;

          if (brightness < 35) {
            data[i + 3] = 0; // Đen hoàn toàn -> Trong suốt
          } else if (brightness < 90) {
            // Khử mờ viền đen xám
            data[i + 3] = Math.floor((brightness - 35) / 55 * 255);
          }
        }

        ctx.putImageData(imgData, 0, 0);
      };
      img.src = imgSource;
    }

    logoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => processAndDrawImage(event.target.result);
        reader.readAsDataURL(file);
      }
    });

    // 2. ICON RƠI
    const fallingItems = ['🐱', '🐈‍⬛', '🐾', '🎬', '🎞️', '🍿', '🎟️', '⭐'];
    const container = document.getElementById('fallingContainer');

    function createFallingItem() {
      const item = document.createElement('div');
      item.className = 'falling-item';
      item.innerText = fallingItems[Math.floor(Math.random() * fallingItems.length)];
      item.style.left = Math.random() * 100 + 'vw';
      item.style.fontSize = (Math.random() * 16 + 22) + 'px';
      item.style.animationDuration = (Math.random() * 5 + 6) + 's';
      container.appendChild(item);
      setTimeout(() => item.remove(), 10000);
    }
    setInterval(createFallingItem, 600);

    // 3. GỬI DỮ LIỆU
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzZgiy9o0E1RvZm-35B98GfEy1i40cjl2W526cJ8jY5TkL65oF4eOaFdyQs7qyDPa_-UA/exec";
    document.getElementById("ecopForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const submitBtn = document.getElementById("submitBtn");
      submitBtn.innerText = "⏳ Đang gửi...";
      submitBtn.disabled = true;

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          name: document.getElementById("name").value,
          phone: document.getElementById("phone").value,
          className: document.getElementById("className").value,
          email: document.getElementById("email").value
        })
      }).then(() => {
        document.getElementById("formScreen").style.display = "none";
        document.getElementById("successScreen").style.display = "block";
      });
    });
  </script>
</body>
</html>
